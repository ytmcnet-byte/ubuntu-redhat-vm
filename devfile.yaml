schemaVersion: 2.2.0
metadata:
  name: ubuntu-2204-vps-max
  version: 1.0.0
  displayName: Ubuntu 22.04 Max Resource VPS
components:
  - name: ubuntu-dev
    container:
      image: ubuntu:22.04
      memoryLimit: 26Gi
      memoryRequest: 4Gi
      cpuLimit: 2500m
      cpuRequest: 500m
      command: ['/bin/sh', '-c', 'trap : TERM INT; sleep infinity & wait']
